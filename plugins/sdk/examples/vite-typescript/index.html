<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operit Plugin SDK · Vite example</title>

  <body>
    <main class="page-shell">
      <p class="eyebrow">Operit Plugin SDK</p>
      <h1>Plugin catalog from a Vite app</h1>

      <section id="catalog" aria-live="polite"></section>

    <script type="module" src="/src/main.ts"></script>
