name: desktop_widgets_macos
description: macOS transparent desktop surface implementation for desktop_widgets.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    implements: desktop_widgets
    platforms:
      macos:
        pluginClass: DesktopWidgetsMacosPlugin
