[package]
name = "operit-plugin-sdk-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
operit-host-api = { path = "../../core/crates/foundation/host-api" }
operit-host-native-plugin-sdk-ipc = { path = "../common/operit-host-native-plugin-sdk-ipc" }
jni = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "4", features = ["blocking"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
