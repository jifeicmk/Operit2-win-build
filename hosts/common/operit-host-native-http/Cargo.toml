[package]
name = "operit-host-native-http"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
http-body-util = "0.1"
operit-host-api = { path = "../../../core/crates/foundation/host-api" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls", "stream"] }
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
